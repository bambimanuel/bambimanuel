<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Bambi Manuel, Engenheiro Informático Web e Mobile, B-Software House" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.55" stop-color="#111a3a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="20"/></clipPath>
    <style>
      .sans { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Courier New', monospace; }
      .pulse1 { animation: pulse 6s ease-in-out infinite; }
      .pulse2 { animation: pulse 7s ease-in-out infinite reverse; }
      .blink { animation: blink 1s steps(1) infinite; }
      .float { animation: float 5s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
      @keyframes blink { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    </style>
  </defs>

  <g clip-path="url(#round)">
