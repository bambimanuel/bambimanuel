    <rect x="60" y="232" width="78" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.5"/>
    <text x="99" y="254">Flutter</text>
    <rect x="150" y="232" width="130" height="34" rx="17" fill="#ffffff" fill-opacity="0.08" stroke="#60a5fa" stroke-opacity="0.5"/>
    <text x="215" y="254">React Native</text>
