      <text x="784" y="120"><tspan fill="#c084fc">const</tspan> <tspan fill="#60a5fa">bambi</tspan> <tspan fill="#e5e7eb">= {</tspan></text>
      <text x="804" y="146"><tspan fill="#e5e7eb">role:</tspan> <tspan fill="#86efac">"Web &amp; Mobile"</tspan><tspan fill="#e5e7eb">,</tspan></text>
      <text x="804" y="172"><tspan fill="#e5e7eb">agency:</tspan> <tspan fill="#86efac">"B-Software House"</tspan><tspan fill="#e5e7eb">,</tspan></text>
      <text x="804" y="198"><tspan fill="#e5e7eb">mobile:</tspan> <tspan fill="#86efac">["Flutter", "Kotlin"]</tspan><tspan fill="#e5e7eb">,</tspan></text>
      <text x="804" y="224"><tspan fill="#e5e7eb">mission:</tspan> <tspan fill="#86efac">"automatizar"</tspan></text>
      <text x="784" y="250"><tspan fill="#e5e7eb">};</tspan></text>
