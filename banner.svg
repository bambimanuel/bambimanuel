    <circle class="pulse1" cx="160" cy="40" r="260" fill="url(#glow1)"/>
    <circle class="pulse2" cx="1040" cy="290" r="300" fill="url(#glow2)"/>
    <g stroke="#ffffff" stroke-opacity="0.04">
      <path d="M0 80H1200M0 160H1200M0 240H1200"/>
      <path d="M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

