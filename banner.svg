    <text x="590" y="254">Python</text>
  </g>

  <text class="sans" x="60" y="295" font-size="14" fill="#9ca3af" letter-spacing="1">CEO · B-SOFTWARE HOUSE · ANGOLA</text>

  <g class="float">
    <rect x="760" y="52" width="380" height="216" rx="14" fill="#0b1020" stroke="#ffffff" stroke-opacity="0.15"/>
